<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        User Registration
                    </h2>

                    <div class="mb-3">
                        <input type="text"
                               id="name"
                               class="form-control"
                               placeholder="Enter Name">
                    </div>

                    <div class="mb-3">
                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="Enter Email">
                    </div>

                    <div class="mb-3">
                        <input type="password"
                               id="password"
                               class="form-control"
                               placeholder="Enter Password">
                    </div>

                    <div class="mb-3">
                        <select id="role"
                                class="form-select">

                            <option value="USER">
                                USER
                            </option>

                            <option value="ADMIN">
                                ADMIN
                            </option>

                        </select>
                    </div>

                    <button class="btn btn-success w-100"
                            onclick="registerUser()">

                        Register
                    </button>

                    <div class="text-center mt-3">
                        <a href="login.html">
                            Already have an account?
                            Login
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/register.js"></script>

</body>
</html>
